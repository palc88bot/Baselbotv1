steps:
  # 1. بناء صورة Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/baselbot-brain', '.']

  # 2. رفع الصورة إلى Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/baselbot-brain']

  # 3. نشر الخدمة على Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'baselbot-brain'
      - '--image'
      - 'gcr.io/$PROJECT_ID/baselbot-brain'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'NODE_ENV=production,EXECUTION_MODE=TESTNET,GEMINI_API_KEY=${_GEMINI_API_KEY}'

substitutions:
  _GEMINI_API_KEY: 'YOUR_GEMINI_KEY_HERE'

options:
  logging: CLOUD_LOGGING_ONLY
